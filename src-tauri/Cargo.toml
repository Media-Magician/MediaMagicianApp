[package]
name = "MediaMagician"
version = "0.3.0"
description = "The media magician app"
authors = ["VioPaige"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "media_magician_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
ffmpeg-sidecar = "2.4.0"
tauri-plugin-fs = "2"
sha2 = "0.10.9"
ffmpeg-next = { version = "8.0.0", default-features = false, features = ["codec", "format", "filter", "software-resampling", "software-scaling"] }
tauri-plugin-deep-link = "2"
libc = "0.2.182"

[patch.crates-io]
ffmpeg-sys-next = { git = "https://github.com/Media-Magician/rust-ffmpeg-sys.git", branch = "main" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

