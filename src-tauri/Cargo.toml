[package]
name = "MediaMagician"
version = "0.5.0"
description = "The media magician app"
authors = ["VioPaige"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "media_magician_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# tauri = { version = "2", features = ["devtools", "cef"] }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
sha2 = "0.10.9"
ffmpeg-next = { version = "=8.0.0", default-features = false, features = ["codec", "format", "filter", "software-resampling", "software-scaling"] }
ffmpeg-sys-next = { version = "=8.0.1", default-features = false } # force this version to use the patched version which is a patch of 8.0.1
libc = "0.2.182"
base64 = "0.23.1"

[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "2", features = ["devtools", "cef"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
