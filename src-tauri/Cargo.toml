[package]
name = "MediaMagician"
version = "0.3.0"
description = "The media magician app"
authors = ["VioPaige"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "media_magician_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "2", features = ["devtools", "cef"] }
# tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
sha2 = "0.10.9"
ffmpeg-next = { version = "8.0.0", default-features = false, features = ["codec", "format", "filter", "software-resampling", "software-scaling"] }
libc = "0.2.182"


[patch.crates-io]
# tauri = { path = "/home/paige/Documents/GitHub/tauri_branch_cef/crates/tauri" }
# tauri-utils = { path = "/home/paige/Documents/GitHub/tauri_branch_cef/crates/tauri-utils" }
# tauri-plugin = { path = "/home/paige/Documents/GitHub/tauri_branch_cef/crates/tauri-plugin" }
tauri = { git = "https://github.com/Media-Magician/tauri.git", branch = "feat/cef_mm" }
tauri-utils = { git = "https://github.com/Media-Magician/tauri.git", branch = "feat/cef_mm" }
tauri-plugin = { git = "https://github.com/Media-Magician/tauri.git", branch = "feat/cef_mm" }

tauri-plugin-opener = { git = "https://github.com/Media-Magician/tauri-plugins-workspace.git", branch = "v2" }
# tauri-plugin-opener = { path = "/home/paige/Documents/GitHub/plugins_tauri_branch_cef/plugins/opener" }
tauri-plugin-deep-link = { git = "https://github.com/Media-Magician/tauri-plugins-workspace.git", branch = "v2" }
# tauri-plugin-deep-link = { path = "/home/paige/Documents/GitHub/plugins_tauri_branch_cef/plugins/deep-link" }
tauri-plugin-fs = { git = "https://github.com/Media-Magician/tauri-plugins-workspace.git", branch = "v2" }
# tauri-plugin-fs = { path = "/home/paige/Documents/GitHub/plugins_tauri_branch_cef/plugins/fs" }
tauri-plugin-dialog = { git = "https://github.com/Media-Magician/tauri-plugins-workspace.git", branch = "v2", features = ["xdg-portal"], default-features = false }
# tauri-plugin-dialog = { path = "/home/paige/Documents/GitHub/plugins_tauri_branch_cef/plugins/dialog" }

ffmpeg-sys-next = { git = "https://github.com/Media-Magician/rust-ffmpeg-sys.git", branch = "main" }

